server {
    listen 80;
    server_name localhost;

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
