# Nitro Renderer — Main (8081) + Dev (8082)
#
# Standalone compose file for Nitro instances.
# Nitro is a static nginx server — does NOT need to join the kodexa network.
# All browser→WS connections go directly host→Arcturus (not through Docker networking).
#
# IMPORTANT: The main Nitro instance (kodexa-nitro-renderer on port 8081) is
# managed separately (started outside this file). Do NOT run the `nitro` service
# here if kodexa-nitro-renderer is already running — port 8081 will conflict.
#
# Normal usage — start only Nitro Dev:
#   docker compose -f docker/docker-compose.nitro.yml up -d nitro-dev
#
# If starting fresh (no existing Nitro main):
#   docker compose -f docker/docker-compose.nitro.yml up -d
#
# Build image (first time or after Nitro source update):
#   docker compose -f docker/docker-compose.nitro.yml build nitro
#
# Ports:
#   Main:  http://localhost:8081  → ws://localhost:2096 (Arcturus main)
#   Dev:   http://localhost:8082  → ws://localhost:2097 (Arcturus dev)

services:
  nitro:
    build:
      context: ../external/arcturus/nitro-docker/nitro
      dockerfile: Dockerfile
    image: kodexa-nitro:latest
    container_name: kodexa-nitro
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ../external/arcturus/objectretros/nitro/renderer-config.local.json:/usr/share/nginx/html/renderer-config.json:ro
      - ../external/arcturus/objectretros/nitro/ui-config.local.json:/usr/share/nginx/html/ui-config.json:ro
      - ../external/arcturus/nitro-docker/nitro/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  nitro-dev:
    image: kodexa-nitro:latest
    container_name: kodexa-nitro-dev
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ../external/arcturus/objectretros/nitro/renderer-config.dev.json:/usr/share/nginx/html/renderer-config.json:ro
      - ../external/arcturus/objectretros/nitro/ui-config.local.json:/usr/share/nginx/html/ui-config.json:ro
      - ../external/arcturus/nitro-docker/nitro/nginx.conf:/etc/nginx/conf.d/default.conf:ro
